name: UI/UX portfolio browser QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Figma builder source and native-design smoke harness
        run: |
          node --check design-system/figma-plugin/code.js
          node tests/figma-builder-smoke.cjs
      - name: Upload Figma builder
        uses: actions/upload-artifact@v4
        with:
          name: interface-craft-figma-builder
          path: design-system/figma-plugin/
          if-no-files-found: error
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm test
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-screenshots
          path: screenshots/
          if-no-files-found: ignore
      - name: Save test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
